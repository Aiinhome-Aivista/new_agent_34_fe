<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Dark Obsidian Gradient -->
    <linearGradient id="agentic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="50%" stop-color="#111418" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="agentic-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF5A14" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF5A14" stop-opacity="0.1" />
    </linearGradient>

    <!-- Primary Brand Orange Gradient -->
    <linearGradient id="agentic-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA070" />
      <stop offset="50%" stop-color="#FF5A14" />
      <stop offset="100%" stop-color="#D94302" />
    </linearGradient>

    <!-- Core Bright Spark Gradient -->
    <linearGradient id="agentic-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF2EC" />
      <stop offset="100%" stop-color="#FF7A45" />
    </linearGradient>

    <!-- Radial Glow Behind the Agent -->
    <radialGradient id="agentic-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A14" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FF5A14" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF5A14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base (Obsidian Squircle with Theme Border) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#agentic-bg)" stroke="url(#agentic-border)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="24" fill="url(#agentic-glow)" />

  <!-- Autonomous Defense Shield Outline -->
  <path
    d="M32 10.5 L48.5 17.5 C48.5 32 41.5 44.5 32 52.5 C22.5 44.5 15.5 32 15.5 17.5 Z"
    fill="#FF5A14"
    fill-opacity="0.08"
    stroke="url(#agentic-primary)"
    stroke-width="1.75"
    stroke-linejoin="round"
  />

  <!-- Internal Circuit & Agent Network Traces -->
  <path
    d="M22 23 L28 28.5 M42 23 L36 28.5 M23.5 39.5 L28 34.5 M40.5 39.5 L36 34.5"
    stroke="#FF7A45"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-opacity="0.6"
  />

  <!-- Neural Orbital Ring -->
  <circle
    cx="32"
    cy="31.5"
    r="7.5"
    fill="none"
    stroke="#FFA070"
    stroke-width="1"
    stroke-dasharray="2.5 2"
    stroke-opacity="0.75"
  />

  <!-- Agent 4-point Intelligence Spark -->
  <path
    d="M32 18.5 Q32 31.5 19 31.5 Q32 31.5 32 44.5 Q32 31.5 45 31.5 Q32 31.5 32 18.5 Z"
    fill="url(#agentic-core)"
  />

  <!-- Agent Perception Satellite Nodes -->
  <circle cx="22" cy="23" r="2" fill="#FFA070" />
  <circle cx="42" cy="23" r="2" fill="#FFA070" />
  <circle cx="23.5" cy="39.5" r="2" fill="#FF7A45" />
  <circle cx="40.5" cy="39.5" r="2" fill="#FF7A45" />

  <!-- Shield Apex / Crown Beacon -->
  <circle cx="32" cy="11" r="1.5" fill="#FFFFFF" />

  <!-- Central Intelligence Hotspot Nucleus -->
  <circle cx="32" cy="31.5" r="2.2" fill="#FFFFFF" />
  <circle cx="32" cy="31.5" r="1" fill="#FF5A14" />
</svg>
